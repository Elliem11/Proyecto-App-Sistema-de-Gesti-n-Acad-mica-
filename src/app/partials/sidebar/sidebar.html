<aside [class.open]="open()">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true"></span>
    <div class="brand__text">
      <strong>Gestión Académica</strong>
      <small>{{ info().tagline }}</small>
    </div>
  </div>

  <nav aria-label="Menú principal">
    @for (item of menu(); track item.route) {
      <a [routerLink]="item.route" routerLinkActive="active" (click)="navigated.emit()">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            @switch (item.icon) {
              @case ('home') {
                <path d="M4 11l8-7 8 7"/>
                <path d="M6 10v10h12V10"/>
              }
              @case ('calendar') {
                <rect x="4" y="5" width="16" height="15" rx="3"/>
                <path d="M4 10h16M9 3v4M15 3v4"/>
              }
              @case ('check') {
                <rect x="4" y="4" width="16" height="16" rx="4"/>
                <path d="M8 12l3 3 5-6"/>
              }
              @case ('bell') {
                <path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/>
                <path d="M10 20a2 2 0 0 0 4 0"/>
              }
              @case ('clipboard') {
                <rect x="6" y="4" width="12" height="16" rx="2"/>
                <path d="M9 9h6M9 13h6M9 17h3"/>
              }
              @case ('cap') {
                <path d="M2 9l10-5 10 5-10 5z"/>
                <path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/>
              }
              @case ('book') {
                <path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/>
                <path d="M4 5v16"/>
              }
              @case ('user') {
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>
              }
              @case ('users') {
                <circle cx="9" cy="8" r="3.5"/>
                <path d="M3 20c1-3.5 3.2-5 6-5s5 1.5 6 5"/>
                <path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 15c1.8.6 3 2.4 3 5"/>
              }
              @case ('lock') {
                <rect x="5" y="11" width="14" height="10" rx="2"/>
                <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
              }
              @case ('pen') {
                <path d="M4 20l4-1 11-11-3-3L5 16z"/>
                <path d="M14 6l3 3"/>
              }
              @case ('chart') {
                <path d="M4 20h16"/>
                <rect x="6" y="12" width="3" height="6"/>
                <rect x="11" y="8" width="3" height="10"/>
                <rect x="16" y="5" width="3" height="13"/>
              }
              @case ('file') {
                <path d="M7 3h7l5 5v13H7z"/>
                <path d="M14 3v5h5M10 13h6M10 17h6"/>
              }
              @case ('archive') {
                <rect x="3" y="4" width="18" height="4" rx="1"/>
                <path d="M5 8v12h14V8M10 12h4"/>
              }
              @default {
                <circle cx="12" cy="12" r="8"/>
                <path d="M12 8v4l2.5 2"/>
              }
            }
          </svg>
        </span>
        <span class="label">{{ item.label }}</span>
      </a>
    }
  </nav>
</aside>
