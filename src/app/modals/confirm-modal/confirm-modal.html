<div class="backdrop" (click)="cancelled.emit()">
  <div class="modal" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>
    <div class="actions">
      <button type="button" class="btn btn-ghost" (click)="cancelled.emit()">Cancelar</button>
      <button type="button" class="btn" (click)="confirmed.emit()">{{ confirmLabel() }}</button>
    </div>
  </div>
</div>
