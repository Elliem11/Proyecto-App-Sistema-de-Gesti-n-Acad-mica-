<header class="head">
  <div class="head__text">
    <p class="eyebrow">Mi horario</p>
    <h1>Mi horario</h1>
    <p class="muted">Clases de la semana</p>
  </div>

  <svg class="head__art" viewBox="0 0 280 150" aria-hidden="true">
    <circle class="ring r1" cx="200" cy="75" r="68"/>
    <circle class="ring r2" cx="200" cy="75" r="44"/>

    <!-- reloj -->
    <g class="float">
      <circle cx="200" cy="75" r="30" fill="#0c0c0e"/>
      <circle cx="200" cy="75" r="30" fill="none" stroke="#fbf9fd" stroke-opacity=".15" stroke-width="2"/>
      <path d="M200 58v17l11 7" fill="none" stroke="#fbf9fd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- tarjeta calendario -->
    <g class="float b">
      <rect x="20" y="28" width="100" height="72" rx="14" fill="#fbf9fd" opacity=".95"/>
      <rect x="20" y="28" width="100" height="18" rx="9" fill="#f4e3da"/>
      <rect x="20" y="40" width="100" height="6" fill="#f4e3da"/>
      <rect x="36" y="58" width="14" height="10" rx="3" fill="#0c0c0e" opacity=".75"/>
      <rect x="58" y="58" width="14" height="10" rx="3" fill="#d3dcf2"/>
      <rect x="80" y="58" width="14" height="10" rx="3" fill="#dce7e1"/>
      <rect x="36" y="76" width="14" height="10" rx="3" fill="#e4def0"/>
      <rect x="58" y="76" width="14" height="10" rx="3" fill="#0c0c0e" opacity=".75"/>
      <rect x="80" y="76" width="14" height="10" rx="3" fill="#f4e3da"/>
    </g>

    <!-- chip de clase -->
    <g class="float c">
      <rect x="120" y="112" width="64" height="26" rx="9" fill="#0c0c0e"/>
      <rect x="130" y="121" width="30" height="5" rx="2.5" fill="#fbf9fd" opacity=".85"/>
      <rect x="130" y="130" width="18" height="3" rx="1.5" fill="#fbf9fd" opacity=".35"/>
    </g>

    <circle class="dot" cx="20" cy="18" r="4" fill="#0c0c0e"/>
    <circle class="dot" cx="262" cy="26" r="3" fill="#0c0c0e" opacity=".5"/>
    <circle class="dot" cx="140" cy="10" r="3" fill="#0c0c0e"/>
    <circle class="dot" cx="268" cy="130" r="4" fill="#0c0c0e" opacity=".5"/>
  </svg>
</header>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        @for (c of columns; track c) {
          <th>{{ c }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows; track $index) {
        <tr>
          @for (cell of row; track $index) {
            <td>{{ cell }}</td>
          }
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="columns.length" class="empty">No tienes clases registradas.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
