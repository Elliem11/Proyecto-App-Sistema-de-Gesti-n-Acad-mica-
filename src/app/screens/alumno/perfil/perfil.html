<header class="head">
  <div class="head__text">
    <p class="eyebrow">Mi cuenta</p>
    <h1>Perfil</h1>
    <p class="muted">Actualiza tus datos de contacto</p>
  </div>

  <svg class="head__art" viewBox="0 0 280 150" aria-hidden="true">
    <circle class="ring r1" cx="200" cy="75" r="68"/>
    <circle class="ring r2" cx="200" cy="75" r="44"/>

    <!-- avatar -->
    <g class="float">
      <circle cx="200" cy="75" r="30" fill="#0c0c0e"/>
      <circle cx="200" cy="66" r="10" fill="#f4e3da"/>
      <path d="M182 98c3-9 10-14 18-14s15 5 18 14" fill="#f4e3da"/>
    </g>

    <!-- tarjeta de identidad -->
    <g class="float b">
      <rect x="18" y="30" width="104" height="62" rx="14" fill="#fbf9fd" opacity=".95"/>
      <circle cx="44" cy="61" r="12" fill="#d3dcf2"/>
      <rect x="64" y="50" width="46" height="6" rx="3" fill="#0c0c0e" opacity=".75"/>
      <rect x="64" y="62" width="32" height="5" rx="2.5" fill="#0c0c0e" opacity=".2"/>
      <rect x="64" y="72" width="24" height="5" rx="2.5" fill="#0c0c0e" opacity=".2"/>
    </g>

    <!-- chips de dato -->
    <g class="float c">
      <rect x="30" y="108" width="46" height="20" rx="8" fill="#dce7e1"/>
      <rect x="84" y="108" width="46" height="20" rx="8" fill="#f4e3da"/>
      <rect x="138" y="108" width="46" height="20" rx="8" fill="#e4def0"/>
    </g>

    <circle class="dot" cx="20" cy="18" r="4" fill="#0c0c0e"/>
    <circle class="dot" cx="262" cy="26" r="3" fill="#0c0c0e" opacity=".5"/>
    <circle class="dot" cx="140" cy="10" r="3" fill="#0c0c0e"/>
    <circle class="dot" cx="268" cy="130" r="4" fill="#0c0c0e" opacity=".5"/>
  </svg>
</header>

<form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <label for="nombre">Nombre</label>
  <input id="nombre" type="text" formControlName="nombre" />
  @if (invalid('nombre')) {
    <small class="error">Escribe tu nombre completo.</small>
  }

  <label for="correo">Correo</label>
  <input id="correo" type="email" formControlName="correo" />
  @if (invalid('correo')) {
    <small class="error">El correo no es válido.</small>
  }

  <label for="telefono">Teléfono</label>
  <input id="telefono" type="tel" formControlName="telefono" />
  @if (invalid('telefono')) {
    <small class="error">Escribe 10 dígitos.</small>
  }

  @if (sent()) {
    <div class="alert ok" role="status">Datos actualizados.</div>
  }

  <div class="actions">
    <button class="btn" type="submit">Guardar cambios</button>
  </div>
</form>
