<header class="head">
  <div class="head__text">
    <p class="eyebrow">Mis tareas</p>
    <h1>Mis tareas</h1>
    <p class="muted">Pendientes y entregadas</p>
  </div>

  <svg class="head__art" viewBox="0 0 280 150" aria-hidden="true">
    <circle class="ring r1" cx="200" cy="75" r="68"/>
    <circle class="ring r2" cx="200" cy="75" r="44"/>

    <!-- hoja de tarea con check -->
    <g class="float">
      <rect x="168" y="38" width="64" height="78" rx="12" fill="#0c0c0e"/>
      <rect x="182" y="32" width="36" height="12" rx="6" fill="#f4e3da"/>
      <path d="M182 72l5 5 9-10" fill="none" stroke="#fbf9fd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="182" y="90" width="30" height="5" rx="2.5" fill="#fbf9fd" opacity=".7"/>
      <rect x="182" y="101" width="20" height="5" rx="2.5" fill="#fbf9fd" opacity=".35"/>
    </g>

    <!-- tarjeta pendiente -->
    <g class="float b">
      <rect x="18" y="30" width="104" height="54" rx="14" fill="#fbf9fd" opacity=".95"/>
      <circle cx="42" cy="57" r="9" fill="none" stroke="#0c0c0e" stroke-opacity=".5" stroke-width="2"/>
      <rect x="60" y="50" width="44" height="6" rx="3" fill="#0c0c0e" opacity=".75"/>
      <rect x="60" y="62" width="28" height="5" rx="2.5" fill="#0c0c0e" opacity=".2"/>
    </g>

    <!-- chips de estado -->
    <g class="float c">
      <rect x="22" y="104" width="54" height="22" rx="8" fill="#f4e3da"/>
      <rect x="84" y="104" width="54" height="22" rx="8" fill="#d3dcf2"/>
    </g>

    <circle class="dot" cx="20" cy="18" r="4" fill="#0c0c0e"/>
    <circle class="dot" cx="262" cy="26" r="3" fill="#0c0c0e" opacity=".5"/>
    <circle class="dot" cx="140" cy="10" r="3" fill="#0c0c0e"/>
    <circle class="dot" cx="268" cy="130" r="4" fill="#0c0c0e" opacity=".5"/>
  </svg>
</header>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        @for (c of columns; track c) {
          <th>{{ c }}</th>
        }
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (row of rows; track $index) {
        <tr>
          @for (cell of row; track $index) {
            <td>{{ cell }}</td>
          }
          <td class="actions">
            <a class="link" [routerLink]="['/alumno/tareas', row[0]]">Ver detalle</a>
          </td>
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="columns.length + 1" class="empty">No tienes tareas registradas.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
