<header class="head">
  <div class="head__text">
    <p class="eyebrow">Comunicados</p>
    <h1>Avisos</h1>
    <p class="muted">Comunicados de la escuela</p>
  </div>

  <svg class="head__art" viewBox="0 0 280 150" aria-hidden="true">
    <circle class="ring r1" cx="200" cy="75" r="68"/>
    <circle class="ring r2" cx="200" cy="75" r="44"/>

    <!-- campana -->
    <g class="float">
      <circle cx="200" cy="75" r="30" fill="#0c0c0e"/>
      <path d="M200 56a12 12 0 0 0-12 12v9l-3 4h30l-3-4v-9a12 12 0 0 0-12-12z" fill="#fbf9fd"/>
      <path d="M196 84a4 4 0 0 0 8 0" fill="none" stroke="#fbf9fd" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="200" cy="50" r="2.5" fill="#fbf9fd"/>
    </g>

    <!-- sobre de comunicado -->
    <g class="float b">
      <rect x="18" y="30" width="104" height="70" rx="14" fill="#fbf9fd" opacity=".95"/>
      <path d="M26 40l44 32 44-32" fill="none" stroke="#0c0c0e" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="82" width="36" height="5" rx="2.5" fill="#0c0c0e" opacity=".2"/>
    </g>

    <!-- chips de aviso -->
    <g class="float c">
      <rect x="140" y="112" width="60" height="22" rx="8" fill="#f4e3da"/>
      <rect x="208" y="112" width="48" height="22" rx="8" fill="#d3dcf2"/>
    </g>

    <circle class="dot" cx="20" cy="18" r="4" fill="#0c0c0e"/>
    <circle class="dot" cx="262" cy="26" r="3" fill="#0c0c0e" opacity=".5"/>
    <circle class="dot" cx="140" cy="10" r="3" fill="#0c0c0e"/>
    <circle class="dot" cx="268" cy="130" r="4" fill="#0c0c0e" opacity=".5"/>
  </svg>
</header>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        @for (c of columns; track c) {
          <th>{{ c }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows; track $index) {
        <tr>
          @for (cell of row; track $index) {
            <td>{{ cell }}</td>
          }
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="columns.length" class="empty">No hay avisos por ahora.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
